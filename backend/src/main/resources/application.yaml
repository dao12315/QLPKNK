spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/clinic_management
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
logging:
  level:
    org.flywaydb: DEBUG